name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 매주 월요일 09:00 KST (일요일 24:00 UTC) 에 외부 링크 상태를 확인합니다.
    - cron: "0 0 * * 1"

# 같은 브랜치에 연속으로 푸시하면 앞선 실행은 취소해 CI 시간을 아낍니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 감사 3종(콘텐츠·문구·사이트) + TTS 회귀 테스트 + 빌드 + 생성물 커밋 누락 감지
  # 이 저장소는 외부 의존성이 0개라 npm install 단계가 필요 없습니다.
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json 의 engines(>=18) 를 지키는지 함께 확인합니다.
        node: ["18.x", "20.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # check      = audit:content + audit:text + audit:site + test + build
      # verify     = units/ · guides/ · sitemap.xml 이 HEAD와 달라지면 실패
      #              (소스만 고치고 build 를 돌리지 않은 커밋을 잡아냅니다)
      - name: 감사 · 테스트 · 빌드 · 생성물 검증
        run: npm run check:ci

  # 외부 링크(공식 ETS 안내, British Council, ELLLO)는 상대 사이트 사정으로
  # 언제든 끊길 수 있으므로 실패해도 전체 CI 를 막지 않습니다.
  # 확인 시점: 주 1회 예약 실행 + 수동 실행(workflow_dispatch).
  external-links:
    name: external links (알림용 · 실패해도 CI 통과)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: 외부 링크 HTTP 상태 확인
        run: npm run audit:external
